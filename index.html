<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تست ضبط صدا</title>
    <style>
        body {
            font-family: 'Vazirmatn', sans-serif;
            background: #0b0719;
            color: #f0eaff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            flex-direction: column;
            gap: 20px;
        }
        button {
            background: #7c3aed;
            border: none;
            color: #fff;
            padding: 14px 32px;
            border-radius: 10px;
            font-size: 1.2rem;
            cursor: pointer;
            transition: 0.2s;
        }
        button:hover {
            background: #6d28d9;
            transform: scale(1.05);
        }
        button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }
        audio {
            width: 100%;
            max-width: 400px;
            margin-top: 20px;
            border-radius: 10px;
        }
        #status {
            font-size: 1rem;
            color: #8b7aaa;
        }
        #downloadLink {
            color: #f97316;
            text-decoration: none;
            font-weight: 700;
        }
        .container {
            background: rgba(30, 18, 60, 0.5);
            backdrop-filter: blur(12px);
            padding: 40px;
            border-radius: 16px;
            border: 1px solid rgba(124, 58, 237, 0.25);
            max-width: 500px;
            width: 90%;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2 style="color: #a78bfa;">🎤 تست ضبط صدا</h2>
        <div style="margin: 20px 0;">
            <button id="startBtn">▶ شروع ضبط</button>
            <button id="stopBtn" disabled>⏹ توقف و آپلود</button>
        </div>
        <div id="status">وضعیت: آماده</div>
        <audio id="audioPlayer" controls style="display:none;"></audio>
        <br>
        <a id="downloadLink" href="#" download="recording.webm" style="display:none;">⬇ دانلود فایل ضبط‌شده</a>
        <div id="uploadStatus" style="margin-top:12px;font-size:0.9rem;color:#8b7aaa;"></div>
    </div>

    <script>
        const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbyeALZn01_n78iBVQNS4iBGFuxBjJbvaTOWw1imRKuMKZJbk1r2KFCL6BQsEikLDo8L/exec';

        let mediaRecorder = null;
        let audioChunks = [];
        let stream = null;
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const statusDiv = document.getElementById('status');
        const audioPlayer = document.getElementById('audioPlayer');
        const downloadLink = document.getElementById('downloadLink');
        const uploadStatus = document.getElementById('uploadStatus');

        startBtn.addEventListener('click', async () => {
            try {
                stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream, {
                    mimeType: 'audio/webm'
                });
                audioChunks = [];

                mediaRecorder.ondataavailable = (event) => {
                    if (event.data.size > 0) {
                        audioChunks.push(event.data);
                        console.log('Chunk received:', event.data.size);
                    }
                };

                mediaRecorder.onstop = () => {
                    console.log('Recording stopped, creating blob...');
                    const blob = new Blob(audioChunks, { type: 'audio/webm' });
                    console.log('Blob size:', blob.size);

                    // نمایش در مرورگر برای تست پخش
                    const url = URL.createObjectURL(blob);
                    audioPlayer.src = url;
                    audioPlayer.style.display = 'block';
                    downloadLink.href = url;
                    downloadLink.download = 'recording.webm';
                    downloadLink.style.display = 'inline-block';
                    statusDiv.textContent = '✅ ضبط کامل شد. می‌توانید پلی‌بک کنید یا دانلود کنید.';

                    // آپلود خودکار
                    uploadAudioBlob(blob);
                };

                mediaRecorder.start();
                statusDiv.textContent = '🔴 در حال ضبط...';
                startBtn.disabled = true;
                stopBtn.disabled = false;
                uploadStatus.textContent = '';

            } catch (err) {
                statusDiv.textContent = '❌ خطا: ' + err.message;
                console.error(err);
            }
        });

        stopBtn.addEventListener('click', () => {
            if (mediaRecorder && mediaRecorder.state === 'recording') {
                mediaRecorder.stop();
                statusDiv.textContent = '⏹ در حال پردازش...';
                startBtn.disabled = false;
                stopBtn.disabled = true;
                if (stream) {
                    stream.getTracks().forEach(track => track.stop());
                }
            }
        });

        function uploadAudioBlob(blob) {
            if (blob.size === 0) {
                uploadStatus.textContent = '⚠️ فایل خالی است!';
                return;
            }

            uploadStatus.textContent = '📤 در حال ارسال به گوگل‌درایو...';

            const reader = new FileReader();
            reader.onload = function() {
                const base64 = reader.result.split(',')[1];
                const payload = { audio: base64, filename: 'recording.webm' };

                fetch(WEB_APP_URL, {
                    method: 'POST',
                    mode: 'cors',
                    body: JSON.stringify(payload)
                })
                .then(response => response.text())
                .then(data => {
                    console.log('Upload response:', data);
                    uploadStatus.textContent = '✅ آپلود موفق: ' + data;
                })
                .catch(err => {
                    console.error('Upload error:', err);
                    uploadStatus.textContent = '❌ خطا در آپلود: ' + err.message;
                });
            };
            reader.onerror = function() {
                uploadStatus.textContent = '❌ خطا در خواندن فایل';
            };
            reader.readAsDataURL(blob);
        }
    </script>
</body>
</html>
