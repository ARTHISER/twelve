<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎤 ضبط WAV و آپلود به گوگل‌درایو</title>
    <style>
        body {
            font-family: 'Vazirmatn', 'Segoe UI', sans-serif;
            background: #0b0719;
            color: #f0eaff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            flex-direction: column;
            gap: 20px;
            padding: 20px;
        }
        .container {
            background: rgba(30, 18, 60, 0.6);
            backdrop-filter: blur(16px);
            border-radius: 16px;
            border: 1px solid rgba(124, 58, 237, 0.3);
            padding: 40px;
            max-width: 550px;
            width: 100%;
            text-align: center;
            box-shadow: 0 8px 40px rgba(0,0,0,0.5);
        }
        h2 { color: #a78bfa; margin-bottom: 10px; font-size: 1.8rem; }
        .sub { color: #8b7aaa; font-size: 0.9rem; margin-bottom: 20px; }
        .btn-group { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin: 20px 0; }
        button {
            background: #7c3aed; border: none; color: #fff; padding: 12px 28px;
            border-radius: 10px; font-size: 1rem; cursor: pointer;
            transition: all 0.2s ease; font-weight: 600; min-width: 120px;
        }
        button:hover:not(:disabled) { background: #6d28d9; transform: scale(1.04); }
        button:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
        button#stopBtn { background: #ef4444; }
        button#stopBtn:hover:not(:disabled) { background: #dc2626; }
        #status { font-size: 1rem; color: #8b7aaa; margin: 12px 0; min-height: 2rem; }
        audio { width: 100%; margin-top: 16px; border-radius: 8px; background: #1a0f2e; }
        #uploadStatus { font-size: 0.9rem; color: #8b7aaa; margin-top: 12px; }
        .success { color: #4ade80; }
        .error { color: #f87171; }
        .size-info { font-size: 0.8rem; color: #6b5b8a; margin-top: 8px; }
        .debug-info { font-size: 0.7rem; color: #4a3a5a; margin-top: 12px; border-top: 1px solid #2a1a3a; padding-top: 12px; }
        .status-row { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>🎤 ضبط WAV</h2>
        <div class="sub">فرمت WAV استاندارد – قابل پخش در همه‌ی پخش‌کننده‌ها</div>

        <div class="btn-group">
            <button id="startBtn">▶ شروع ضبط</button>
            <button id="stopBtn" disabled>⏹ توقف</button>
        </div>

        <div id="status">وضعیت: آماده</div>

        <audio id="audioPlayer" controls style="display:none;"></audio>

        <div id="uploadStatus"></div>
        <div class="size-info" id="sizeInfo"></div>
        <div class="debug-info" id="debugInfo"></div>
    </div>

    <script>
        // ===== آدرس Web App خود را اینجا قرار دهید =====
        const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbyeALZn01_n78iBVQNS4iBGFuxBjJbvaTOWw1imRKuMKZJbk1r2KFCL6BQsEikLDo8L/exec';

        // ===== DOM =====
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const statusDiv = document.getElementById('status');
        const audioPlayer = document.getElementById('audioPlayer');
        const uploadStatus = document.getElementById('uploadStatus');
        const sizeInfo = document.getElementById('sizeInfo');
        const debugInfo = document.getElementById('debugInfo');

        // ===== متغیرهای ضبط =====
        let audioContext = null;
        let mediaStream = null;
        let sourceNode = null;
        let processorNode = null;
        let isRecording = false;

        // ===== بافر داده‌های PCM =====
        let leftData = [];
        let rightData = [];
        let sampleRate = 0;

        function setStatus(msg, type = '') {
            statusDiv.textContent = msg;
            statusDiv.className = type;
        }

        function setUploadStatus(msg, type = '') {
            uploadStatus.textContent = msg;
            uploadStatus.className = type;
        }

        // ===== تبدیل Float32 به Int16 =====
        function floatTo16BitPCM(output, input, offset) {
            for (let i = 0; i < input.length; i++, offset++) {
                const s = Math.max(-1, Math.min(1, input[i]));
                output[offset] = s < 0 ? s * 0x8000 : s * 0x7FFF;
            }
        }

        // ===== ساخت فایل WAV با هدر صحیح =====
        function encodeWAV(samples, sampleRate) {
            const buffer = new ArrayBuffer(44 + samples.length * 2);
            const view = new DataView(buffer);

            const writeString = (offset, string) => {
                for (let i = 0; i < string.length; i++) {
                    view.setUint8(offset + i, string.charCodeAt(i));
                }
            };

            writeString(0, 'RIFF');
            view.setUint32(4, 36 + samples.length * 2, true);
            writeString(8, 'WAVE');
            writeString(12, 'fmt ');
            view.setUint32(16, 16, true);
            view.setUint16(20, 1, true);
            view.setUint16(22, 1, true);
            view.setUint32(24, sampleRate, true);
            view.setUint32(28, sampleRate * 2, true);
            view.setUint16(32, 2, true);
            view.setUint16(34, 16, true);
            writeString(36, 'data');
            view.setUint32(40, samples.length * 2, true);

            const int16Array = new Int16Array(buffer, 44, samples.length);
            floatTo16BitPCM(int16Array, samples, 0);

            return new Blob([buffer], { type: 'audio/wav' });
        }

        // ===== توقف ضبط و پردازش =====
        function stopRecording() {
            if (!isRecording) return;

            isRecording = false;
            setStatus('⏹ در حال پردازش...');

            // قطع گره‌ها
            if (processorNode) {
                processorNode.disconnect();
                processorNode = null;
            }
            if (sourceNode) {
                sourceNode.disconnect();
                sourceNode = null;
            }
            if (audioContext && audioContext.state !== 'closed') {
                audioContext.close();
                audioContext = null;
            }
            if (mediaStream) {
                mediaStream.getTracks().forEach(track => track.stop());
                mediaStream = null;
            }

            // ترکیب کانال‌ها به مونو
            const length = leftData.length;
            const mono = new Float32Array(length);
            if (rightData.length === 0) {
                for (let i = 0; i < length; i++) mono[i] = leftData[i];
            } else {
                for (let i = 0; i < length; i++) {
                    mono[i] = (leftData[i] + (rightData[i] || 0)) / 2;
                }
            }

            leftData = [];
            rightData = [];

            if (length === 0) {
                setStatus('❌ داده‌ای ضبط نشد', 'error');
                setUploadStatus('❌ فایل خالی است', 'error');
                startBtn.disabled = false;
                stopBtn.disabled = true;
                return;
            }

            debugInfo.textContent = `🔍 تعداد نمونه‌ها: ${length} | نرخ نمونه: ${sampleRate} Hz`;

            const wavBlob = encodeWAV(mono, sampleRate);
            const url = URL.createObjectURL(wavBlob);

            // نمایش پلیر
            audioPlayer.src = url;
            audioPlayer.style.display = 'block';
            audioPlayer.load();

            const sizeKB = (wavBlob.size / 1024).toFixed(1);
            sizeInfo.textContent = `📦 حجم فایل: ${sizeKB} KB (${(wavBlob.size / 1024 / 1024).toFixed(2)} MB)`;

            setStatus(`✅ ضبط کامل شد (${sizeKB} KB)`, 'success');
            startBtn.disabled = false;
            stopBtn.disabled = true;

            // ===== آپلود خودکار به گوگل‌درایو =====
            uploadWAV(wavBlob);
        }

        // ===== آپلود فایل WAV =====
        function uploadWAV(blob) {
            setUploadStatus('📤 در حال ارسال به گوگل‌درایو...');

            const reader = new FileReader();
            reader.onload = function() {
                const base64 = reader.result.split(',')[1];
                const payload = {
                    audio: base64,
                    filename: 'recording.wav' // ← نام فایل با پسوند .wav
                };

                fetch(WEB_APP_URL, {
                    method: 'POST',
                    mode: 'cors',
                    body: JSON.stringify(payload)
                })
                .then(response => response.text())
                .then(data => {
                    console.log('Upload response:', data);
                    setUploadStatus('✅ آپلود موفق: ' + data, 'success');
                })
                .catch(err => {
                    console.error('Upload error:', err);
                    setUploadStatus('❌ خطا در آپلود: ' + err.message, 'error');
                });
            };
            reader.onerror = function() {
                setUploadStatus('❌ خطا در خواندن فایل', 'error');
            };
            reader.readAsDataURL(blob);
        }

        // ===== شروع ضبط =====
        async function startRecordingWAV() {
            try {
                mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });

                audioContext = new(window.AudioContext || window.webkitAudioContext)();
                sampleRate = audioContext.sampleRate;

                sourceNode = audioContext.createMediaStreamSource(mediaStream);
                processorNode = audioContext.createScriptProcessor(4096, 2, 2);

                leftData = [];
                rightData = [];
                isRecording = true;

                processorNode.onaudioprocess = (event) => {
                    if (!isRecording) return;

                    const left = event.inputBuffer.getChannelData(0);
                    const right = event.inputBuffer.getChannelData(1);

                    for (let i = 0; i < left.length; i++) {
                        leftData.push(left[i]);
                        if (right.length > i) rightData.push(right[i]);
                    }
                };

                sourceNode.connect(processorNode);
                processorNode.connect(audioContext.destination);

                setStatus('🔴 در حال ضبط...', '');
                startBtn.disabled = true;
                stopBtn.disabled = false;
                audioPlayer.style.display = 'none';
                uploadStatus.textContent = '';
                sizeInfo.textContent = '';
                debugInfo.textContent = '';

                // توقف خودکار بعد از ۳۰ ثانیه
                setTimeout(() => {
                    if (isRecording) stopRecording();
                }, 30000);

            } catch (err) {
                console.error('Error:', err);
                setStatus('❌ خطا: ' + err.message, 'error');
                startBtn.disabled = false;
                stopBtn.disabled = true;
            }
        }

        // ===== رویدادها =====
        startBtn.addEventListener('click', startRecordingWAV);
        stopBtn.addEventListener('click', stopRecording);

        // تنظیم اولیه
        startBtn.disabled = false;
        stopBtn.disabled = true;
        setStatus('وضعیت: آماده');
    </script>
</body>
</html>
